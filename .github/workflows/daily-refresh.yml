name: Daily data refresh
on:
  schedule:
    - cron: '17 12 * * *'   # 6:17 AM Central (7:17 during daylight time)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas pyarrow numpy
      - run: python pipeline/refresh.py
      - name: Commit updated data
        run: |
          git config user.name "wylie-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/values.json data/players.json data/prospects.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily data refresh $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
